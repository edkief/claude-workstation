[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:api]
command=node /app/server.js
directory=/app
user=node
environment=HOME="/home/node",USER="node"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; The shared-config shell. Only reachable through the dashboard's own
; /config-tty proxy on localhost -- it is not exposed by the Service.
[program:config-ttyd]
command=ttyd -p 7683 -i 127.0.0.1 -b "/config-tty" -W byobu new-session -A -s config
user=node
environment=HOME="/home/node",USER="node",TERM="xterm-256color",DASHBOARD_CONFIG_WRITER="true"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
