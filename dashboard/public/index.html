<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Workstation</title>
<style>
  /* ---------- Design tokens ---------- */
  :root {
    color-scheme: dark;
    --bg:            #0d1117;
    --surface:       #161b22;
    --surface-2:     #21262d;
    --border:        #30363d;
    --border-subtle: #21262d;
    --border-strong: #8b949e;

    --text:          #e6edf3;
    --text-muted:    #8b949e;
    --text-subtle:   #6e7681;

    --accent:        #58a6ff;
    --accent-hover:  #79c0ff;
    --accent-soft:   rgba(88, 166, 255, .12);

    --success:       #3fb950;
    --success-soft:  rgba(63, 185, 80, .12);
    --danger:        #f85149;
    --danger-soft:   rgba(248, 81, 73, .10);
    --danger-border: rgba(248, 81, 73, .38);
    --primary:       #238636;
    --primary-hover: #2ea043;
    --warning:       #d29922;
    --warning-soft:  rgba(210, 153, 34, .12);

    --radius:        10px;
    --radius-sm:     6px;
    --radius-pill:   999px;
    --shadow:        0 1px 3px rgba(1, 4, 9, .55), 0 8px 24px rgba(1, 4, 9, .25);

    --font-ui:   -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg:            #ffffff;
      --surface:       #f6f8fa;
      --surface-2:     #eaeef2;
      --border:        #d0d7de;
      --border-subtle: #d8dee4;
      --border-strong: #8c959f;

      --text:          #1f2328;
      --text-muted:    #656d76;
      --text-subtle:   #818b98;

      --accent:        #0969da;
      --accent-hover:  #0860ca;
      --accent-soft:   rgba(9, 105, 218, .10);

      --success:       #1a7f37;
      --success-soft:  rgba(26, 127, 55, .10);
      --danger:        #cf222e;
      --danger-soft:   rgba(207, 34, 46, .08);
      --danger-border: rgba(207, 34, 46, .35);
      --primary:       #1f883d;
      --primary-hover: #1a7f37;
      --warning:       #9a6700;
      --warning-soft:  rgba(154, 103, 0, .10);

      --shadow:        0 1px 0 rgba(31, 35, 40, .04), 0 4px 14px rgba(31, 35, 40, .08);
    }
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: clamp(1rem, 3vw, 2.25rem);
    display: flex;
    flex-direction: column;
    gap: clamp(1rem, 2.5vw, 1.75rem);
  }
  code, .mono { font-family: var(--font-mono); }
  a { color: var(--accent); }

  /* ---------- Header ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-subtle);
  }
  .topbar-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: .85rem clamp(1rem, 3vw, 2.25rem);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .topbar-overall { display: flex; gap: .75rem; align-items: flex-end; margin-left: auto; margin-right: .5rem; }
  .topbar-overall .stat-bar-group { min-width: 80px; max-width: 110px; }
  .topbar-overall .stat-bar-track { height: 3px; }
  .brand { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
  .brand h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: -.01em; }
  .brand .dot { color: var(--accent); }
  .pod-chip {
    font-family: var(--font-mono);
    font-size: .72rem;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: .1rem .55rem;
  }
  .pod-chip:empty { display: none; }
  .quick-links { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .quick-link {
    font-size: .82rem;
    color: var(--text-muted);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: .35rem .7rem;
    background: var(--surface);
    transition: color .12s, border-color .12s, background .12s;
  }
  .quick-link:hover { color: var(--text); border-color: var(--border-strong); }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border-subtle);
    flex-wrap: wrap;
  }
  .card-head h2 {
    font-size: .8rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .07em;
  }
  .card-body { padding: 1.25rem; }

  /* ---------- Session cards ---------- */
  .session-list { display: flex; flex-direction: column; gap: .65rem; padding: 1.25rem; }
  .session-card {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    padding: .85rem 1rem;
    display: flex;
    flex-direction: column;
    gap: .55rem;
  }
  .session-card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: .75rem;
  }
  .session-name {
    font-family: var(--font-mono);
    font-size: .85rem;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: .75rem;
    flex-wrap: wrap;
  }
  .session-repo {
    font-family: var(--font-mono);
    font-size: .78rem;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-repo .branch { color: var(--accent); }
  .session-time { font-size: .78rem; color: var(--text-subtle); white-space: nowrap; flex-shrink: 0; }
  .session-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: .5rem;
    flex-wrap: wrap;
  }
  .session-stats { display: flex; gap: 1rem; flex-grow: 1; }
  .session-actions { display: flex; gap: .4rem; flex-shrink: 0; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    font-size: .76rem;
    font-weight: 500;
    padding: .15rem .55rem;
    border-radius: var(--radius-pill);
    text-transform: capitalize;
  }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .badge.running     { color: var(--success); background: var(--success-soft); }
  .badge.degraded    { color: var(--warning); background: var(--warning-soft); }
  .badge.starting    { color: var(--accent);  background: var(--accent-soft); }
  .badge.terminating { color: var(--text-muted); background: var(--surface-2); }
  .badge.failed,
  .badge.dead        { color: var(--danger);  background: var(--danger-soft); }
  .badge.starting::before { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .session-message {
    font-size: .75rem; color: var(--text-muted); margin-top: .35rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .oom-chip {
    display: inline-block; font-size: .68rem; padding: .1rem .4rem; border-radius: 4px;
    background: var(--warning-soft); color: var(--warning); margin-left: .4rem;
  }
  /* ---------- In-card log panel ---------- */
  .logs-panel { border-top: 1px solid var(--border); margin-top: .2rem; }
  .logs-panel > summary {
    cursor: pointer;
    list-style: none;
    font-size: .76rem;
    color: var(--text-muted);
    padding: .4rem 0 .1rem;
    display: flex;
    align-items: center;
    gap: .45rem;
    user-select: none;
  }
  .logs-panel > summary::-webkit-details-marker { display: none; }
  .logs-panel > summary::before {
    content: "▸";
    font-size: .7rem;
    transition: transform .12s;
  }
  .logs-panel[open] > summary::before { transform: rotate(90deg); }
  .logs-panel > summary:hover { color: var(--text); }
  .logs-status { margin-left: auto; font-size: .7rem; color: var(--text-subtle); }
  .logs-toolbar {
    display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
    font-size: .72rem; color: var(--text-muted); padding: .35rem 0;
  }
  .logs-toolbar label { display: flex; align-items: center; gap: .3rem; }
  .logs-toolbar select {
    font-size: .72rem; padding: .1rem .25rem;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
  }
  .logs-output {
    font-family: var(--font-mono);
    font-size: .72rem;
    line-height: 1.45;
    white-space: pre;
    overflow: auto;
    max-height: 18rem;
    margin: 0 0 .5rem;
    padding: .55rem .7rem;
    background: var(--surface-2, #0d1117);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
  }

  /* ---------- Token warning ---------- */
  .token-banner {
    display: none;
    align-items: flex-start;
    gap: .6rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .7rem .9rem;
    font-size: .82rem;
  }
  .token-banner.show { display: flex; }
  .token-banner.warn { color: var(--warning); background: var(--warning-soft); border-color: transparent; }
  .token-banner.bad  { color: var(--danger);  background: var(--danger-soft);  border-color: transparent; }
  .token-banner .token-actions { margin-left: auto; display: flex; gap: .4rem; flex-shrink: 0; }

  .ws-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  .ws-table th { text-align: left; font-weight: 500; color: var(--text-muted); padding: .3rem .5rem; }
  .ws-table td { padding: .35rem .5rem; border-top: 1px solid var(--border); }
  .ws-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .use-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .use-dot.on { background: var(--success); }
  .use-dot.off { background: var(--text-muted); opacity: .4; }

  /* ---------- Resource monitoring ---------- */
  .session-stats { display: flex; gap: 1rem; flex-grow: 1; }
  .stat-bar-group { display: flex; flex-direction: column; gap: .2rem; min-width: 90px; flex: 1; max-width: 140px; }
  .stat-bar-row { display: flex; justify-content: space-between; align-items: baseline; gap: .25rem; }
  .stat-label { text-transform: uppercase; letter-spacing: .06em; font-size: .63rem; color: var(--text-muted); }
  .stat-value { font-family: var(--font-mono); font-size: .72rem; color: var(--text); white-space: nowrap; }
  .stat-value.placeholder { color: var(--text-muted); }
  .stat-bar-track { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .stat-bar-fill {
    height: 100%;
    border-radius: 2px;
    width: 0%;
    background: var(--success);
    transition: width .5s cubic-bezier(.4,0,.2,1), background-color .4s ease;
  }
  .stat-bar-fill.warn { background: var(--warning); }
  .stat-bar-fill.crit { background: var(--danger); }

  /* ---------- Forms ---------- */
  form { display: grid; gap: 1rem; max-width: 540px; }
  label { font-size: .85rem; color: var(--text-muted); display: flex; flex-direction: column; gap: .35rem; }
  label > span:first-child { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; color: var(--text); font-weight: 500; }
  .field-note { color: var(--text-muted); font-weight: 400; }
  input[type=text], input[type=number], select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    padding: .55rem .7rem;
    font-family: inherit;
    font-size: .875rem;
    width: 100%;
    transition: border-color .12s, box-shadow .12s;
  }
  input::placeholder { color: var(--text-subtle); }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  select option { background: var(--surface); color: var(--text); }
  .combo { position: relative; }
  .combo-list {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    max-height: 220px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow);
    z-index: 20;
  }
  .combo-item {
    padding: .5rem .7rem;
    font-size: .875rem;
    color: var(--text);
    cursor: pointer;
  }
  .combo-item:hover, .combo-item.active { background: var(--accent-soft); color: var(--accent); }
  .combo-empty { padding: .5rem .7rem; font-size: .875rem; color: var(--text-muted); }
  .checkbox-row { flex-direction: row; align-items: center; gap: .55rem; cursor: pointer; font-weight: 400; color: var(--text); }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
  .mode-toggle {
    font-size: .78rem; color: var(--accent); cursor: pointer;
    background: none; border: none; padding: 0; font-family: inherit; font-weight: 500;
  }
  .mode-toggle:hover { color: var(--accent-hover); text-decoration: underline; }
  .repo-hint { font-size: .75rem; color: var(--text-muted); }

  /* ---------- Buttons ---------- */
  .btn {
    font-family: inherit;
    font-size: .82rem;
    font-weight: 500;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: .45rem .85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .35rem;
    transition: background .12s, border-color .12s, color .12s;
  }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn-ghost { background: var(--surface-2); color: var(--accent); border-color: var(--border); }
  .btn-ghost:hover:not(:disabled) { border-color: var(--border-strong); }
  .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger-border); }
  .btn-danger:hover:not(:disabled) { background: var(--danger-soft); }
  .btn-sm { font-size: .78rem; padding: .35rem .7rem; }

  /* ---------- Cleanup row ---------- */
  .cleanup-row { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
  .cleanup-row .muted { font-size: .875rem; color: var(--text-muted); }
  #cleanup-days { width: 4.5rem; }
  #cleanup-result { font-size: .85rem; color: var(--text-muted); }

  /* ---------- Misc ---------- */
  .empty { color: var(--text-muted); font-size: .875rem; padding: 1.5rem; text-align: center; }
  .form-actions { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .msg { font-size: .85rem; min-height: 1.2rem; }
  #msg-error   { color: var(--danger); }
  #msg-success { color: var(--success); }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid rgba(255, 255, 255, .4); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite;
  }

  /* ---------- Confirm modal ---------- */
  @keyframes modal-in {
    from { opacity: 0; transform: scale(.96) translateY(-6px); }
    to   { opacity: 1; transform: scale(1)  translateY(0); }
  }
  #modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(1, 4, 9, .65);
    backdrop-filter: blur(3px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  @media (prefers-color-scheme: light) {
    #modal-overlay { background: rgba(31, 35, 40, .45); }
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow), 0 0 0 1px var(--border-subtle);
    max-width: 420px;
    width: 100%;
    animation: modal-in .15s ease;
  }
  .modal-body {
    padding: 1.5rem 1.5rem 1rem;
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }
  .modal-body h3 { font-size: 1rem; font-weight: 600; color: var(--text); }
  .modal-body p  { font-size: .875rem; color: var(--text-muted); line-height: 1.6; }
  .modal-footer {
    padding: .75rem 1.5rem 1.25rem;
    display: flex;
    justify-content: flex-end;
    gap: .5rem;
  }

  @media (max-width: 640px) {
    form { max-width: none; }
    .card-body { padding: 1rem; }
    .session-list { padding: 1rem; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>Claude <span class="dot">·</span> Workstation</h1>
      <span class="pod-chip" id="pod-name"></span>
    </div>
    <div class="topbar-overall">
      <div class="stat-bar-group">
        <div class="stat-bar-row">
          <span class="stat-label">CPU</span>
          <span class="stat-value placeholder" id="overall-cpu">—</span>
        </div>
        <div class="stat-bar-track"><div class="stat-bar-fill" id="overall-cpu-bar"></div></div>
      </div>
      <div class="stat-bar-group">
        <div class="stat-bar-row">
          <span class="stat-label">Mem</span>
          <span class="stat-value placeholder" id="overall-mem">—</span>
        </div>
        <div class="stat-bar-track"><div class="stat-bar-fill" id="overall-mem-bar"></div></div>
      </div>
    </div>
    <nav class="quick-links">
      <a href="/config-tty/" target="_blank" class="quick-link">Config shell</a>
      <a href="https://claude.ai/code" target="_blank" class="quick-link">claude.ai/code</a>
    </nav>
  </div>
</header>

<main class="wrap">

  <div class="token-banner" id="token-banner">
    <span id="token-banner-text"></span>
    <span class="token-actions">
      <a class="btn btn-ghost btn-sm" href="/config-tty/" target="_blank">Config shell</a>
      <button class="btn btn-ghost btn-sm" id="token-refresh-btn"
              onclick="refreshToken()">Refresh now</button>
      <button class="btn btn-ghost btn-sm" onclick="loadTokenStatus(true)">Re-check</button>
    </span>
  </div>

  <section class="card">
    <div class="card-head">
      <h2>Active Sessions</h2>
      <span class="muted" id="metrics-hint"></span>
      <button class="btn btn-danger btn-sm" id="remove-inactive-btn" onclick="removeInactiveSessions()">Remove inactive</button>
    </div>
    <div id="sessions-container"><p class="empty">Loading…</p></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Workspace Storage</h2>
      <div class="stat-bar-group" style="min-width:120px;max-width:160px;">
        <div class="stat-bar-row">
          <span class="stat-label">disk</span>
          <span class="stat-value placeholder" id="disk-usage">—</span>
        </div>
        <div class="stat-bar-track"><div class="stat-bar-fill" id="disk-bar"></div></div>
      </div>
    </div>
    <div class="card-body">
      <div class="cleanup-row">
        <span class="muted">Retain workspaces from the last</span>
        <input type="number" id="cleanup-days" min="1" value="30">
        <span class="muted">days</span>
        <button class="btn btn-danger btn-sm" id="cleanup-btn" onclick="cleanupWorkspaces()">Clean up old workspaces</button>
        <span id="cleanup-result"></span>
      </div>
      <div id="workspaces-container" style="margin-top:.75rem">
        <p class="empty">Loading workspaces…</p>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Claude Config</h2>
      <span class="muted" id="config-summary">—</span>
    </div>
    <div class="card-body">
      <div class="cleanup-row">
        <a class="btn btn-ghost btn-sm" href="/config-tty/" target="_blank">Open config shell</a>
        <button class="btn btn-primary btn-sm" id="config-push-btn" onclick="pushConfig()">Sync to S3</button>
        <span id="config-result"></span>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Start New Session</h2>
    </div>
    <div class="card-body">
      <form id="start-form">

        <!-- Repo selector: dropdown or manual -->
        <label id="label-dropdown">
          <span>Repository <button type="button" class="mode-toggle" id="toggle-mode">enter URL manually</button></span>
          <div class="combo" id="repo-combo">
            <input type="text" id="repo-filter" autocomplete="off" placeholder="Loading repositories…">
            <input type="hidden" id="repo-select-value">
            <div class="combo-list" id="repo-list" hidden></div>
          </div>
          <span class="repo-hint" id="repo-hint"></span>
        </label>

        <label id="label-manual" style="display:none">
          <span>Git URL <button type="button" class="mode-toggle" id="toggle-mode-back">pick from list</button></span>
          <input type="text" name="project-manual" id="project-manual" placeholder="git@github.com:user/repo.git">
        </label>

        <label id="label-branch-select">
          <span>Branch <button type="button" class="mode-toggle" id="toggle-branch-mode">enter manually</button></span>
          <select id="branch-select">
            <option value="">— select a repo first —</option>
          </select>
        </label>
        <label id="label-branch-manual" style="display:none">
          <span>Branch <button type="button" class="mode-toggle" id="toggle-branch-mode-back">pick from list</button></span>
          <input type="text" id="branch-manual" placeholder="main">
        </label>

        <label>
          <span>New branch <span class="field-note">(optional — create and checkout after clone)</span></span>
          <input type="text" id="new-branch" placeholder="feature/my-work">
        </label>

        <label class="checkbox-row">
          <input type="checkbox" name="resetHard">
          Reset the checkout to origin <span class="field-note">(discards uncommitted work)</span>
        </label>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Start Session</button>
          <span id="msg-error" class="msg"></span>
          <span id="msg-success" class="msg"></span>
        </div>
      </form>
    </div>
  </section>

</main>

<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" style="display:none">
  <div class="modal">
    <div class="modal-body">
      <h3 id="modal-title"></h3>
      <p id="modal-message"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" id="modal-cancel">Cancel</button>
      <button class="btn btn-danger btn-sm" id="modal-confirm">Confirm</button>
    </div>
  </div>
</div>

<script>
let manualMode = false;
let branchManualMode = false;
let reposCache = [];

// --- Repo dropdown (filterable combobox) ---
function debounce(fn, delay) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
}

const repoFilterInput = document.getElementById('repo-filter');
const repoListEl       = document.getElementById('repo-list');
const repoValueInput   = document.getElementById('repo-select-value');

async function loadRepos() {
  try {
    const res = await fetch('/api/repos');
    if (!res.ok) throw new Error();
    reposCache = await res.json();
    repoFilterInput.placeholder = 'Search repositories…';
    document.getElementById('repo-hint').textContent = `${reposCache.length} repos loaded`;
  } catch {
    reposCache = [];
    repoFilterInput.placeholder = 'Failed to load — use manual mode';
    document.getElementById('repo-hint').textContent = '';
  }
}

function renderRepoList(filter) {
  const q = filter.trim().toLowerCase();
  const filtered = q ? reposCache.filter(r => r.fullName.toLowerCase().includes(q)) : reposCache;

  if (!filtered.length) {
    repoListEl.innerHTML = '<div class="combo-empty">No matches</div>';
  } else {
    repoListEl.innerHTML = filtered.map(r =>
      `<div class="combo-item" data-sshurl="${escHtml(r.sshUrl)}" data-branch="${escHtml(r.defaultBranch)}" data-fullname="${escHtml(r.fullName)}">`
      + `${escHtml(r.fullName)}${r.private ? ' 🔒' : ''}`
      + `</div>`
    ).join('');
  }
  repoListEl.hidden = false;
}

const debouncedRenderRepoList = debounce(renderRepoList, 200);

repoFilterInput.addEventListener('input', () => {
  repoValueInput.value = '';
  debouncedRenderRepoList(repoFilterInput.value);
});
repoFilterInput.addEventListener('focus', () => renderRepoList(repoFilterInput.value));

repoListEl.addEventListener('click', (e) => {
  // .combo-list lives inside <label id="label-dropdown">, whose first labelable
  // descendant is the "toggle-mode" button — without this, clicks anywhere in
  // the list (not just items) get forwarded by the browser to that button.
  e.preventDefault();
  const item = e.target.closest('.combo-item');
  if (!item || !item.dataset.sshurl) return;
  selectRepo(item.dataset.sshurl, item.dataset.fullname, item.dataset.branch);
});

document.addEventListener('click', (e) => {
  if (!document.getElementById('repo-combo').contains(e.target)) repoListEl.hidden = true;
});
repoFilterInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') repoListEl.hidden = true;
});

function selectRepo(sshUrl, fullName, defaultBranch) {
  repoFilterInput.value = fullName;
  repoValueInput.value = sshUrl;
  repoListEl.hidden = true;
  loadBranchesForRepo(fullName, defaultBranch);
}

async function loadBranchesForRepo(fullName, defaultBranch) {
  const sel = document.getElementById('branch-select');

  if (!fullName) {
    sel.innerHTML = '<option value="">— select a repo first —</option>';
    return;
  }

  sel.innerHTML = '<option value="">Loading branches…</option>';
  sel.disabled = true;

  try {
    const res = await fetch(`/api/branches?repo=${encodeURIComponent(fullName)}`);
    if (!res.ok) throw new Error();
    const branches = await res.json();
    sel.innerHTML = branches.map(b =>
      `<option value="${escHtml(b)}"${b === defaultBranch ? ' selected' : ''}>${escHtml(b)}</option>`
    ).join('');
    // Also sync manual input
    document.getElementById('branch-manual').value = defaultBranch || '';
  } catch {
    sel.innerHTML = '<option value="">Failed to load branches</option>';
    // Fall back to manual with default branch pre-filled
    document.getElementById('branch-manual').value = defaultBranch || '';
    setBranchManualMode(true);
  } finally {
    sel.disabled = false;
  }
}

function setBranchManualMode(manual) {
  branchManualMode = manual;
  document.getElementById('label-branch-select').style.display = manual ? 'none' : '';
  document.getElementById('label-branch-manual').style.display = manual ? '' : 'none';
}
document.getElementById('toggle-branch-mode').addEventListener('click', () => setBranchManualMode(true));
document.getElementById('toggle-branch-mode-back').addEventListener('click', () => setBranchManualMode(false));

// --- Mode toggle ---
function setManualMode(manual) {
  manualMode = manual;
  document.getElementById('label-dropdown').style.display = manual ? 'none' : '';
  document.getElementById('label-manual').style.display = manual ? '' : 'none';
}
document.getElementById('toggle-mode').addEventListener('click', () => setManualMode(true));
document.getElementById('toggle-mode-back').addEventListener('click', () => setManualMode(false));

// --- Sessions ---
// Ids we are waiting on. While non-empty the poll runs fast, so a starting
// workspace does not sit behind a 10s dead stare.
const pendingIds = new Set();
const SETTLED = new Set(['running', 'degraded', 'failed']);
let sessionTimer = null;

function scheduleSessionPoll() {
  clearTimeout(sessionTimer);
  sessionTimer = setTimeout(loadSessions, pendingIds.size ? 2_000 : 10_000);
}

let lastSessions = [];

async function loadSessions() {
  try {
    const res = await fetch('/api/sessions');
    const sessions = await res.json();
    if (!res.ok) throw new Error(sessions.message || 'Failed to load sessions.');
    lastSessions = sessions;
    for (const s of sessions) if (SETTLED.has(s.status)) pendingIds.delete(s.id);
    for (const id of [...pendingIds]) {
      if (!sessions.some(s => s.id === id)) pendingIds.delete(id);
    }
    renderSessions(sessions);
  } catch (err) {
    document.getElementById('sessions-container').innerHTML =
      `<p class="empty">${escHtml(err.message || 'Failed to load sessions.')}</p>`;
  } finally {
    scheduleSessionPoll();
  }
}

function sessionById(id) { return lastSessions.find(s => s.id === id); }

function oomChip(s) {
  return s.restartCount > 0 && s.lastTerminationReason === 'OOMKilled'
    ? `<span class="oom-chip">restarted ${s.restartCount}\u00d7 (OOMKilled)</span>` : '';
}

function makeSessionCard(s) {
  const started = s.startedAt ? new Date(s.startedAt).toLocaleString() : '—';
  const resPlaceholder = s.ready ? '…' : '—';
  const card = document.createElement('div');
  card.className = 'session-card';
  card.dataset.session = s.id;
  card.innerHTML = `
    <div class="session-card-head">
      <span class="session-name" title="${escHtml(s.id)}">${escHtml(s.displayName)}</span>
      <span class="badge ${escHtml(s.status)}">${escHtml(s.status)}</span>
    </div>
    <div class="session-meta">
      <span class="session-repo">${escHtml(s.repoFullName)} <span class="branch">${escHtml(s.branch)}</span>${oomChip(s)}</span>
      <span class="session-time">${started}</span>
    </div>
    <div class="session-message">${escHtml(s.message || '')}</div>
    <div class="session-footer">
      <div class="session-stats">
        <div class="stat-bar-group">
          <div class="stat-bar-row">
            <span class="stat-label">CPU</span>
            <span class="stat-value placeholder" id="cpu-${escHtml(s.id)}">${resPlaceholder}</span>
          </div>
          <div class="stat-bar-track"><div class="stat-bar-fill" id="cpu-bar-${escHtml(s.id)}"></div></div>
        </div>
        <div class="stat-bar-group">
          <div class="stat-bar-row">
            <span class="stat-label">Mem</span>
            <span class="stat-value placeholder" id="mem-${escHtml(s.id)}">${resPlaceholder}</span>
          </div>
          <div class="stat-bar-track"><div class="stat-bar-fill" id="mem-bar-${escHtml(s.id)}"></div></div>
        </div>
      </div>
      <div class="session-actions">
        <button class="btn btn-ghost btn-sm" data-role="terminal"
                onclick="openTerminal('${escHtml(s.id)}')"
                ${terminalAttrs(s)}>Terminal</button>
        <button class="btn btn-danger btn-sm" onclick="terminateSession('${escHtml(s.id)}')">Terminate</button>
      </div>
    </div>
    <details class="logs-panel" data-role="logs">
      <summary>Logs<span class="logs-status" data-role="logs-status"></span></summary>
      <div class="logs-toolbar">
        <label><input type="checkbox" data-role="logs-auto" checked> Auto-refresh</label>
        <label>Lines
          <select data-role="logs-tail">
            <option value="200">200</option>
            <option value="500" selected>500</option>
            <option value="2000">2000</option>
            <option value="5000">5000</option>
          </select>
        </label>
        <a href="/api/sessions/${encodeURIComponent(s.id)}/logs?tail=500" target="_blank">Open raw</a>
      </div>
      <pre class="logs-output" data-role="logs-output">Loading logs…</pre>
    </details>`;
  wireLogPanel(card, s.id);
  return card;
}

// The Terminal button follows terminalReady, not ready: after a login failure
// the pod is permanently not-ready, and the terminal is the only place the
// user can run /login to fix it.
function terminalAttrs(s) {
  if (s.terminalReady) {
    return s.authFailed ? 'title="Claude needs a login \u2014 run /login here"' : '';
  }
  return `disabled title="${escHtml(s.message || 'workspace is still starting')}"`;
}

function renderSessions(sessions) {
  const container = document.getElementById('sessions-container');

  if (!sessions.length) {
    container.innerHTML = '<p class="empty">No active sessions.</p>';
    return;
  }

  // Create the list shell once; reuse on subsequent renders so DOM state is preserved
  if (!container.querySelector('.session-list')) {
    container.innerHTML = '<div class="session-list"></div>';
  }

  const list = container.querySelector('.session-list');
  const existing = new Map([...list.querySelectorAll('[data-session]')].map(c => [c.dataset.session, c]));

  sessions.forEach((s, i) => {
    let card = existing.get(s.id);
    if (!card) {
      card = makeSessionCard(s);
      existing.set(s.id, card);
    } else {
      const badge = card.querySelector('.badge');
      if (badge) { badge.className = `badge ${s.status}`; badge.textContent = s.status; }
      const msg = card.querySelector('.session-message');
      if (msg) msg.textContent = s.message || '';
      const repo = card.querySelector('.session-repo');
      if (repo) {
        repo.innerHTML = `${escHtml(s.repoFullName)} <span class="branch">${escHtml(s.branch)}</span>${oomChip(s)}`;
      }
      const term = card.querySelector('[data-role="terminal"]');
      if (term) {
        term.disabled = !s.terminalReady;
        if (!s.terminalReady) term.title = s.message || 'workspace is still starting';
        else if (s.authFailed) term.title = 'Claude needs a login \u2014 run /login here';
        else term.removeAttribute('title');
      }
    }
    const atPos = list.children[i];
    if (atPos !== card) list.insertBefore(card, atPos || null);
  });

  const currentIds = new Set(sessions.map(s => s.id));
  for (const [id, card] of existing) {
    if (!currentIds.has(id)) { stopLogPoll(id); card.remove(); }
  }
}

// No activate call any more: each workspace has its own proxied terminal.
function openTerminal(id) {
  const s = sessionById(id);
  window.open(s ? s.terminalUrl : `/tty/${encodeURIComponent(id)}/`, '_blank');
}

// --- In-card logs ---
// A panel rather than a new tab: the point of these logs is to watch a session
// that is starting or stuck, right next to the status that made you look.
const LOG_POLL_MS = 3_000;
const logTimers = new Map();

function wireLogPanel(card, id) {
  const panel = card.querySelector('[data-role="logs"]');
  const auto = card.querySelector('[data-role="logs-auto"]');
  const tail = card.querySelector('[data-role="logs-tail"]');

  panel.addEventListener('toggle', () => {
    if (panel.open) refreshLogs(card, id, { schedule: true });
    else stopLogPoll(id);
  });
  auto.addEventListener('change', () => {
    stopLogPoll(id);
    if (panel.open) refreshLogs(card, id, { schedule: true });
  });
  tail.addEventListener('change', () => {
    const link = card.querySelector('.logs-toolbar a');
    if (link) link.href = `/api/sessions/${encodeURIComponent(id)}/logs?tail=${tail.value}`;
    if (panel.open) refreshLogs(card, id, { schedule: true });
  });
}

function stopLogPoll(id) {
  clearTimeout(logTimers.get(id));
  logTimers.delete(id);
}

async function refreshLogs(card, id, { schedule = false } = {}) {
  const panel = card.querySelector('[data-role="logs"]');
  if (!panel || !panel.open || !card.isConnected) return stopLogPoll(id);

  const out = card.querySelector('[data-role="logs-output"]');
  const statusEl = card.querySelector('[data-role="logs-status"]');
  const lines = card.querySelector('[data-role="logs-tail"]').value;

  try {
    const res = await fetch(`/api/sessions/${encodeURIComponent(id)}/logs?tail=${lines}`);
    const text = await res.text();
    if (out.textContent !== text) {
      // Only pin to the bottom if the reader was already there -- otherwise a
      // refresh yanks them off the line they were reading.
      const atBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 40;
      out.textContent = text || '(no output yet)';
      if (atBottom) out.scrollTop = out.scrollHeight;
    }
    statusEl.textContent = res.ok
      ? `updated ${new Date().toLocaleTimeString()}`
      : `error ${res.status}`;
  } catch {
    statusEl.textContent = 'fetch failed';
  } finally {
    const auto = card.querySelector('[data-role="logs-auto"]');
    if (schedule && auto.checked && panel.open && card.isConnected) {
      stopLogPoll(id);
      logTimers.set(id, setTimeout(() => refreshLogs(card, id, { schedule: true }), LOG_POLL_MS));
    }
  }
}

async function terminateSession(id) {
  const s = sessionById(id);
  const label = s ? s.displayName : id;
  if (!await showConfirm('Terminate session',
      `Terminate "${label}"? The pod stops, but its storage (checkout, node_modules, ` +
      `uncommitted work) is kept for the next session.`, 'Terminate')) return;
  try {
    await fetch(`/api/sessions/${encodeURIComponent(id)}`, { method: 'DELETE' });
    loadSessions();
  } catch {
    await showAlert('Error', 'Failed to terminate session.');
  }
}

async function removeInactiveSessions() {
  const btn = document.getElementById('remove-inactive-btn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/sessions');
    if (!res.ok) throw new Error();
    const sessions = await res.json();
    const inactive = sessions.filter(s => ['failed', 'degraded'].includes(s.status));
    if (!inactive.length) { await showAlert('No inactive sessions', 'There are no inactive sessions to remove.'); return; }
    if (!await showConfirm('Remove inactive sessions', `Remove ${inactive.length} inactive session(s)?`, 'Remove')) return;
    await Promise.all(inactive.map(s =>
      fetch(`/api/sessions/${encodeURIComponent(s.id)}`, { method: 'DELETE' })
    ));
    loadSessions();
  } catch {
    await showAlert('Error', 'Failed to remove inactive sessions.');
  } finally {
    btn.disabled = false;
  }
}

// --- Resource monitoring ---
function fmtCpu(millicores) {
  if (millicores >= 1000) return (millicores / 1000).toFixed(2) + ' cores';
  return millicores + 'm';
}
function fmtMem(mib) {
  if (mib >= 1024) return (mib / 1024).toFixed(2) + ' GiB';
  return mib.toFixed(0) + ' MiB';
}

function barLevel(pct) {
  if (pct >= 85) return 'crit';
  if (pct >= 60) return 'warn';
  return '';
}

// Maxima are read from each pod's own limits rather than hardcoded. The old
// MEM_MAX of 2048 did not match the 4Gi pod limit, so the bar read double.
function paintBar(valueEl, barEl, value, limit, fmt) {
  if (!valueEl) return;
  valueEl.textContent = fmt(value);
  valueEl.className = 'stat-value';
  if (!barEl) return;
  if (!limit) { barEl.style.width = '0%'; barEl.className = 'stat-bar-fill'; return; }
  const pct = Math.min(100, (value / limit) * 100);
  barEl.style.width = pct + '%';
  barEl.className = 'stat-bar-fill ' + barLevel(pct);
}

function hideResourceBars(note) {
  for (const el of document.querySelectorAll('.stat-bar-group .stat-bar-track')) {
    el.style.display = 'none';
  }
  const hint = document.getElementById('metrics-hint');
  if (hint) hint.textContent = note;
}

function updateResourceCells(data) {
  if (data.source === 'unavailable') {
    hideResourceBars('live metrics unavailable — install metrics-server');
    return;
  }

  for (const [id, stats] of Object.entries(data.sessions || {})) {
    paintBar(document.getElementById(`cpu-${id}`), document.getElementById(`cpu-bar-${id}`),
             stats.cpuMillicores, stats.cpuLimitMillicores, fmtCpu);
    paintBar(document.getElementById(`mem-${id}`), document.getElementById(`mem-bar-${id}`),
             stats.memMiB, stats.memLimitMiB, fmtMem);
  }

  if (data.totals) {
    const t = data.totals;
    paintBar(document.getElementById('overall-cpu'), document.getElementById('overall-cpu-bar'),
             t.cpuMillicores, t.cpuLimitMillicores, fmtCpu);
    paintBar(document.getElementById('overall-mem'), document.getElementById('overall-mem-bar'),
             t.memMiB, t.memLimitMiB, fmtMem);
  }
}

async function loadResources() {
  try {
    const res = await fetch('/api/resources');
    if (!res.ok) return;
    updateResourceCells(await res.json());
  } catch { /* silently ignore transient errors */ }
}

// --- Form submit ---
document.getElementById('start-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const errEl = document.getElementById('msg-error');
  const okEl  = document.getElementById('msg-success');
  errEl.textContent = '';
  okEl.textContent  = '';

  const project = manualMode
    ? document.getElementById('project-manual').value.trim()
    : document.getElementById('repo-select-value').value;

  if (!project) {
    errEl.textContent = manualMode ? 'Please enter a Git URL.' : 'Please select a repository.';
    return;
  }

  const branch = branchManualMode
    ? document.getElementById('branch-manual').value.trim()
    : document.getElementById('branch-select').value.trim();

  if (!branch) { errEl.textContent = 'Branch is required.'; return; }

  const newBranch = document.getElementById('new-branch').value.trim();
  const body = {
    project, branch,
    resetHard: form.resetHard.checked,
    ...(newBranch && { newBranch }),
  };

  const submitBtn = form.querySelector('button[type=submit]');
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span>Starting…';

  try {
    await submitSession(body, { errEl, okEl, form });
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = 'Start Session';
  }
});

async function submitSession(body, { errEl, okEl, form }) {
  let res;
  try {
    res = await fetch('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  } catch {
    errEl.textContent = 'Request failed.';
    return;
  }

  // Storage is per repo and only one pod may hold it, so a second session for
  // the same repo is a conflict the user resolves rather than an error.
  if (res.status === 409) {
    const data = await res.json();
    if (data.error === 'workspace_busy' && data.session) {
      const choice = await showChoice('Workspace already running', data.message, [
        { key: 'attach',  label: 'Open terminal', className: 'btn-primary' },
        { key: 'replace', label: 'Replace',       className: 'btn-danger' },
        { key: 'cancel',  label: 'Cancel',        className: 'btn-ghost' },
      ]);
      if (choice === 'attach') { window.open(data.session.terminalUrl, '_blank'); return; }
      if (choice === 'replace') { return submitSession({ ...body, replace: true }, { errEl, okEl, form }); }
      return;
    }
    errEl.textContent = data.message || 'Conflict.';
    return;
  }

  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    errEl.textContent = data.message || data.error || `Request failed (${res.status}).`;
    return;
  }

  // 202: the pod exists but is not ready. Poll it into view.
  const session = await res.json();
  pendingIds.add(session.id);
  okEl.textContent = `Starting "${session.displayName}"…`;
  if (form) {
    form.reset();
    document.getElementById('branch-select').innerHTML = '<option value="">— select a repo first —</option>';
    document.getElementById('branch-manual').value = '';
    document.getElementById('new-branch').value = '';
  }
  loadSessions();
}

async function cleanupWorkspaces() {
  const btn = document.getElementById('cleanup-btn');
  const resultEl = document.getElementById('cleanup-result');
  const days = parseInt(document.getElementById('cleanup-days').value, 10);

  if (!days || days < 1) {
    resultEl.style.color = 'var(--danger)';
    resultEl.textContent = 'Enter a valid number of days.';
    return;
  }

  if (!await showConfirm('Clean up workspace storage',
      `Delete storage for workspaces untouched for ${days}+ day(s)? Checkouts and any ` +
      `uncommitted work in them are lost. Volumes in use are skipped.`, 'Delete')) return;

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Cleaning…';
  resultEl.style.color = 'var(--text-muted)';
  resultEl.textContent = '';

  try {
    const res = await fetch('/api/workspaces/prune', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ olderThanDays: days }),
    });
    if (!res.ok) {
      const data = await res.json();
      throw new Error(data.error || 'Request failed');
    }
    const data = await res.json();
    if (data.deleted.length === 0) {
      resultEl.style.color = 'var(--text-muted)';
      resultEl.textContent = 'No workspaces to clean up.';
    } else {
      resultEl.style.color = 'var(--success)';
      resultEl.textContent = `Deleted ${data.deleted.length} workspace(s), freed ${data.totalFreedGi} GiB.`;
    }
    loadSessions();
    loadDiskUsage();
  } catch (err) {
    resultEl.style.color = 'var(--danger)';
    resultEl.textContent = err.message || 'Cleanup failed.';
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Clean up old workspaces';
  }
}

/**
 * N-button modal. showConfirm/showAlert are wrappers over it so the existing
 * overlay markup, focus handling and Escape/Enter behaviour are reused.
 * Resolves with the chosen button's `key`, or `cancelKey` if dismissed.
 */
function showChoice(title, message, buttons, cancelKey = 'cancel') {
  return new Promise(resolve => {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-message').textContent = message;

    const actions = document.getElementById('modal-confirm').parentElement;
    const previous = actions.innerHTML;
    actions.innerHTML = '';

    const overlay = document.getElementById('modal-overlay');
    overlay.style.display = 'flex';

    function cleanup(result) {
      overlay.style.display = 'none';
      overlay.onclick = null;
      document.removeEventListener('keydown', onKey);
      actions.innerHTML = previous;   // restore the ids showConfirm relies on
      resolve(result);
    }
    function onKey(e) { if (e.key === 'Escape') cleanup(cancelKey); }

    // Reverse order so the primary action sits rightmost, as before.
    for (const b of [...buttons].reverse()) {
      const el = document.createElement('button');
      el.className = `btn btn-sm ${b.className || 'btn-ghost'}`;
      el.textContent = b.label;
      el.onclick = () => cleanup(b.key);
      actions.prepend(el);
    }
    actions.lastElementChild?.focus();

    overlay.onclick = (e) => { if (e.target === overlay) cleanup(cancelKey); };
    document.addEventListener('keydown', onKey);
  });
}

async function showConfirm(title, message, confirmLabel = 'Confirm', alertOnly = false) {
  const buttons = alertOnly
    ? [{ key: 'ok', label: 'OK', className: 'btn-primary' }]
    : [{ key: 'cancel', label: 'Cancel', className: 'btn-ghost' },
       { key: 'ok', label: confirmLabel, className: 'btn-danger' }];
  return (await showChoice(title, message, buttons)) === 'ok';
}

function showAlert(title, message) {
  return showConfirm(title, message, '', true);
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

fetch('/api/info').then(r => r.json()).then(d => {
  if (d.dashboardPod) document.getElementById('pod-name').textContent = d.dashboardPod;
  if (d.metricsAvailable === false) {
    hideResourceBars('live metrics unavailable — install metrics-server');
  }
}).catch(() => {});

function fmtGi(v) { return v === null || v === undefined ? '—' : v.toFixed(1) + ' GiB'; }

async function loadDiskUsage() {
  try {
    const d = await fetch('/api/disk').then(r => r.json());

    const pct = d.totalCapacityGi ? Math.round((d.totalUsedGi / d.totalCapacityGi) * 100) : 0;
    const el = document.getElementById('disk-usage');
    const bar = document.getElementById('disk-bar');
    if (el) {
      el.textContent = `${fmtGi(d.totalUsedGi)} / ${fmtGi(d.totalCapacityGi)}`;
      el.classList.remove('placeholder');
    }
    if (bar) {
      bar.style.width = pct + '%';
      bar.classList.toggle('warn', pct >= 70 && pct < 90);
      bar.classList.toggle('crit', pct >= 90);
    }
    renderWorkspaces(d.items || []);
  } catch { /* ignore */ }
}

function renderWorkspaces(items) {
  const container = document.getElementById('workspaces-container');
  if (!container) return;

  if (!items.length) {
    container.innerHTML = '<p class="empty">No workspace storage yet.</p>';
    return;
  }

  const rows = items.map(w => `
    <tr>
      <td><span class="use-dot ${w.inUse ? 'on' : 'off'}" title="${w.inUse ? 'in use' : 'idle'}"></span></td>
      <td>${escHtml(w.repoFullName || w.name)}</td>
      <td class="num">${fmtGi(w.usedGi)}${w.live ? '' : '<span class="muted" title="last recorded value">*</span>'}</td>
      <td class="num">${fmtGi(w.capacityGi)}</td>
      <td class="num">${w.ageDays === null ? '—' : w.ageDays + 'd'}</td>
      <td class="num">
        <button class="btn btn-danger btn-sm" onclick="deleteWorkspace('${escHtml(w.name)}')"
                ${w.inUse ? 'disabled title="terminate the session first"' : ''}>Delete</button>
      </td>
    </tr>`).join('');

  container.innerHTML = `
    <table class="ws-table">
      <thead><tr><th></th><th>Repository</th><th class="num">Used</th>
      <th class="num">Size</th><th class="num">Idle</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function deleteWorkspace(name) {
  if (!await showConfirm('Delete workspace storage',
      `Delete the volume for "${name}"? Its checkout and any uncommitted work are lost.`,
      'Delete')) return;
  try {
    const res = await fetch(`/api/workspaces/${encodeURIComponent(name)}`, { method: 'DELETE' });
    if (!res.ok && res.status !== 204) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.message || 'Delete failed');
    }
    loadDiskUsage();
  } catch (err) {
    await showAlert('Error', err.message || 'Failed to delete workspace storage.');
  }
}

// --- shared Claude config ---------------------------------------------------
async function loadConfigStatus() {
  const el = document.getElementById('config-summary');
  if (!el) return;
  try {
    const d = await fetch('/api/config/status').then(r => r.json());
    if (!d.available) { el.textContent = d.message || 'sync unavailable'; return; }
    if (d.configured === false) { el.textContent = 'S3 not configured'; return; }
    const parts = [`v${d.remoteVersion}`, `push: ${d.pushPolicy}`];
    if (d.behind) parts.push('behind — pull first');
    if (d.localChanges?.length) parts.push(`${d.localChanges.length} local change(s)`);
    el.textContent = parts.join(' · ');
  } catch {
    el.textContent = 'sync unavailable';
  }
}

async function pushConfig() {
  const btn = document.getElementById('config-push-btn');
  const out = document.getElementById('config-result');
  btn.disabled = true;
  out.style.color = 'var(--text-muted)';
  out.textContent = 'Syncing…';
  try {
    const res = await fetch('/api/config/push', { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    if (res.status === 409) {
      out.style.color = 'var(--warning)';
      out.textContent = data.message || 'Remote config moved on; pull first.';
    } else if (!res.ok) {
      out.style.color = 'var(--danger)';
      out.textContent = data.message || 'Push failed.';
    } else {
      out.style.color = 'var(--success)';
      out.textContent = 'Synced to S3.';
    }
  } catch {
    out.style.color = 'var(--danger)';
    out.textContent = 'Push failed.';
  } finally {
    btn.disabled = false;
    loadConfigStatus();
  }
}

// --- shared Claude token watchdog -------------------------------------------
// The dashboard re-checks the shared login on a timer and now also renews it;
// this only renders the verdict. An expired shared token breaks every *new*
// workspace, which used to show up only as a session stuck on "starting Claude…".
const TOKEN_TONE = {
  valid: null, unknown: null,
  expiring: 'warn', stale: 'warn',
  expired: 'bad', missing: 'bad', unreadable: 'bad',
};

// A renewal that failed is worth saying even while the token still works: it
// only ever fires inside the refresh window, so it means the token really is
// close to expiry and the automation could not save it. Nothing is shown for
// a healthy loop -- a permanent banner is a banner people stop reading.
function autoRefreshNote(auto) {
  if (!auto || !auto.last || auto.last.ok !== false) return null;
  if (auto.last.action === 'disabled') return null;
  return `auto-refresh ${auto.last.action}: ${auto.last.message || 'see dashboard logs'}`;
}

async function loadTokenStatus(fresh = false) {
  const banner = document.getElementById('token-banner');
  const text = document.getElementById('token-banner-text');
  if (!banner) return;
  try {
    const d = await fetch(`/api/config/token${fresh ? '?fresh=1' : ''}`).then(r => r.json());
    const note = autoRefreshNote(d.autoRefresh);
    const tone = TOKEN_TONE[d.state] || (note ? 'warn' : null);
    if (!tone) {
      banner.className = 'token-banner';
      return;
    }
    banner.className = `token-banner show ${tone}`;
    text.textContent = [TOKEN_TONE[d.state] ? `Claude login: ${d.message || d.state}` : null, note]
      .filter(Boolean).join(' — ');
  } catch {
    banner.className = 'token-banner';
  }
}

// Forced: renew even when the token is not yet due. The button exists for the
// case where you want to know *now* whether the automation still works,
// rather than finding out at expiry.
async function refreshToken() {
  const btn = document.getElementById('token-refresh-btn');
  const text = document.getElementById('token-banner-text');
  if (btn) { btn.disabled = true; btn.textContent = 'Refreshing…'; }
  try {
    const r = await fetch('/api/config/token/refresh?force=1', { method: 'POST' });
    const d = await r.json();
    if (text && d.action) text.textContent = `Claude login: ${d.message || d.action}`;
  } catch (e) {
    if (text) text.textContent = `Claude login: refresh request failed (${e.message})`;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Refresh now'; }
    loadTokenStatus(true);
  }
}

loadRepos();
loadSessions();          // self-scheduling: 2s while anything is starting, else 10s
loadResources();
loadDiskUsage();
loadConfigStatus();
loadTokenStatus();
setInterval(loadResources,     5_000);
setInterval(loadDiskUsage,    60_000);
setInterval(loadConfigStatus, 60_000);
// The server-side check is the 30-minute one; this just re-reads its verdict.
setInterval(loadTokenStatus, 300_000);
</script>
