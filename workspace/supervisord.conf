[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

; One pod, one workspace, one Claude session. `new-session -A` attaches to the
; existing session if there is one, so every browser tab shares the same
; terminal -- which is now the correct behaviour.
;
; ttyd bakes its base path into the JS it serves, so it must be told the exact
; prefix the dashboard proxies it under (TTY_BASE_PATH=/tty/<workspace-id>).
[program:ttyd]
command=ttyd -p 7681 -b "%(ENV_TTY_BASE_PATH)s" -W byobu new-session -A -s claude
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",NVM_DIR="/home/ubuntu/.nvm",TERM="xterm-256color",GITHUB_TOKEN="%(ENV_GITHUB_TOKEN)s",GH_TOKEN="%(ENV_GITHUB_TOKEN)s"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/ttyd.log
stderr_logfile=/var/log/supervisor/ttyd.log

[program:agent]
command=node /home/ubuntu/agent/agent.js
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",AGENT_PORT="7682",WORKSPACE_ID="%(ENV_WORKSPACE_ID)s",BRANCH="%(ENV_BRANCH)s",CLAUDE_SESSION_NAME="%(ENV_CLAUDE_SESSION_NAME)s"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/agent.log
stderr_logfile=/var/log/supervisor/agent.log

[program:postgres]
command=/bin/bash -c 'exec $(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)/postgres -D /home/ubuntu/pgdata -c listen_addresses=localhost -p 5432'
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.log
