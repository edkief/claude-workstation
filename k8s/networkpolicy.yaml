---
# Ports 7681 (shell), 7682 (agent), and 7684 (Codex UI) are unauthenticated
# inside the cluster. With one pod per workspace the exposure multiplies, so
# only the dashboard may reach them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claude-workspace-ingress
  namespace: dev
spec:
  podSelector:
    matchLabels:
      app: claude-workspace
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: claude-dashboard
      ports:
        - protocol: TCP
          port: 7681
        - protocol: TCP
          port: 7682
        - protocol: TCP
          port: 7684
