# Example secrets. Copy, fill in real base64 values, apply -- do not commit.
# `kubectl create secret generic ... --from-literal` is easier than hand-encoding.
---
apiVersion: v1
kind: Secret
metadata:
  name: github-ssh-key
  namespace: dev
type: Opaque
data:
  # base64 of the private key used for git clone over SSH
  id_rsa: <BASE64_PRIVATE_KEY>
  # base64 of a GitHub PAT, used by the dashboard to list repos/branches
  github_token: <BASE64_GITHUB_TOKEN>
---
# S3 configuration. Targets Garage (or any S3-compatible server), not AWS.
#
# | Key                    | Required | Default | Notes                          |
# |------------------------|----------|---------|--------------------------------|
# | S3_ENDPOINT            | yes      | --      | Garage's S3 API endpoint       |
# | S3_ACCESS_KEY_ID       | yes      | --      | Garage key ID (GK...)          |
# | S3_SECRET_ACCESS_KEY   | yes      | --      | Garage secret                  |
# | S3_BUCKET              | no       | claude-config |                          |
# | S3_REGION              | no       | garage  | MUST match garage.toml s3_region -- it is part of the SigV4 signature |
# | S3_PROVIDER            | no       | Other   | rclone has no `Garage` provider; `Other` is correct |
# | S3_FORCE_PATH_STYLE    | no       | true    | Garage serves bucket/key paths, not bucket-as-subdomain |
# | S3_PREFIX              | no       | config  | Key prefix within the bucket   |
#
# Create the bucket and two keys in Garage first:
#   garage bucket create claude-config
#   garage key create claude-config-rw
#   garage key create claude-config-ro
#   garage bucket allow --read --write claude-config --key claude-config-rw
#   garage bucket allow --read        claude-config --key claude-config-ro
#
#   kubectl create secret generic claude-config-s3-rw -n dev \
#     --from-literal=S3_ENDPOINT=https://garage.kieffer.me \
#     --from-literal=S3_BUCKET=claude-config \
#     --from-literal=S3_REGION=garage \
#     --from-literal=S3_ACCESS_KEY_ID=GK... \
#     --from-literal=S3_SECRET_ACCESS_KEY=...
#
# Read-write: held by the dashboard always, and by workspace pods only when
# CONFIG_PUSH_POLICY=any.
apiVersion: v1
kind: Secret
metadata:
  name: claude-config-s3-rw
  namespace: dev
type: Opaque
stringData:
  S3_ENDPOINT: "https://garage.kieffer.me"
  S3_BUCKET: "claude-config"
  S3_REGION: "garage"
  S3_ACCESS_KEY_ID: "<RW_ACCESS_KEY>"
  S3_SECRET_ACCESS_KEY: "<RW_SECRET_KEY>"
---
# Read-only, handed to workspace pods whenever CONFIG_PUSH_POLICY is
# `dashboard` or `additive`. Provisioned up front so the policy can be flipped
# without creating new cluster objects.
apiVersion: v1
kind: Secret
metadata:
  name: claude-config-s3-ro
  namespace: dev
type: Opaque
stringData:
  S3_ENDPOINT: "https://garage.kieffer.me"
  S3_BUCKET: "claude-config"
  S3_REGION: "garage"
  S3_ACCESS_KEY_ID: "<RO_ACCESS_KEY>"
  S3_SECRET_ACCESS_KEY: "<RO_SECRET_KEY>"
