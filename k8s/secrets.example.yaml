# Example secrets. Copy, fill in real base64 values, apply -- do not commit.
# `kubectl create secret generic ... --from-literal` is easier than hand-encoding.
---
apiVersion: v1
kind: Secret
metadata:
  name: github-ssh-key
  namespace: dev
type: Opaque
data:
  # base64 of the private key used for git clone over SSH
  id_rsa: <BASE64_PRIVATE_KEY>
  # base64 of a GitHub PAT, used by the dashboard to list repos/branches
  github_token: <BASE64_GITHUB_TOKEN>
---
# Read-write S3 credentials. Held by the dashboard always, and by workspace
# pods only when CONFIG_PUSH_POLICY=any.
#
#   kubectl create secret generic claude-config-s3-rw -n dev \
#     --from-literal=S3_ENDPOINT=https://s3.kieffer.me \
#     --from-literal=S3_BUCKET=claude-config \
#     --from-literal=S3_ACCESS_KEY_ID=... \
#     --from-literal=S3_SECRET_ACCESS_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: claude-config-s3-rw
  namespace: dev
type: Opaque
stringData:
  S3_ENDPOINT: "https://s3.kieffer.me"
  S3_BUCKET: "claude-config"
  S3_REGION: "us-east-1"
  S3_ACCESS_KEY_ID: "<RW_ACCESS_KEY>"
  S3_SECRET_ACCESS_KEY: "<RW_SECRET_KEY>"
---
# Read-only S3 credentials, handed to workspace pods whenever
# CONFIG_PUSH_POLICY is `dashboard` or `additive`. Provisioned up front so the
# policy can be flipped without creating new cluster objects.
apiVersion: v1
kind: Secret
metadata:
  name: claude-config-s3-ro
  namespace: dev
type: Opaque
stringData:
  S3_ENDPOINT: "https://s3.kieffer.me"
  S3_BUCKET: "claude-config"
  S3_REGION: "us-east-1"
  S3_ACCESS_KEY_ID: "<RO_ACCESS_KEY>"
  S3_SECRET_ACCESS_KEY: "<RO_SECRET_KEY>"
